<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SK Solar Solutions | On-Grid Solar Rooftop EPC Company in Pune, Maharashtra</title>
    <!--
      Site-wide SEO fallback for this client-rendered SPA. Every route serves
      this same file, so these are generic on purpose: they exist for
      link-preview bots (WhatsApp, Facebook, LinkedIn) which do NOT execute JS
      and therefore only ever see this raw HTML, whichever page was shared.

      For anything that does run JS (Google included), SeoHead.jsx overwrites
      each of these IN PLACE with page-specific values, so there is never a
      duplicate description/og tag. Adding a tag here is safe; SeoHead adopts
      any tag it also manages.

      No canonical here on purpose — a static one would point every route at
      "/". SeoHead sets the correct per-page canonical.
    -->
    <meta
      name="description"
      content="SK Solar Solutions designs, supplies, installs and commissions on-grid rooftop solar power plants for homes, businesses and institutions across Pune, Solapur and Kolhapur. MNRE &amp; IEC certified components, 25-year panel warranty, complete MSEDCL net-metering support. Get a free solar quote today."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SK Solar Solutions" />
    <meta property="og:title" content="SK Solar Solutions | On-Grid Solar Rooftop EPC Company in Pune, Maharashtra" />
    <meta property="og:description" content="On-grid rooftop solar power plants for homes, businesses and institutions across Pune, Solapur and Kolhapur. MNRE & IEC certified, 25-year panel warranty. Get a free quote." />
    <meta property="og:image" content="https://surya-kiran-solar-solutions.vercel.app/assets/logo/company-logo.jpeg" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0B2447" />
    <link rel="icon" type="image/jpeg" href="/assets/logo/company-logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!--
      Applies the theme before first paint. React mounts too late for this: a
      visitor who chose dark would get a white flash on every page load while
      the bundle downloads and hydrates. Inline and synchronous on purpose —
      it must run before the browser paints anything.

      Kept in sync with getInitialTheme() in src/context/ThemeContext.jsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("sk-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* localStorage blocked — light theme is a fine default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
